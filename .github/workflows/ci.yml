name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # Node 26.x LTS
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: MongoDB integration tests and Bruno smoke test
    # Pinned to match the Database Tools package below.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/book-tracker-test
      # The backup and restore drill must run here, not be skipped for missing tools.
      REQUIRE_DATABASE_TOOLS: '1'
      DATABASE_TOOLS_VERSION: 100.16.1
      DATABASE_TOOLS_SHA256: e4f58be8674e01c372a15ff69a6da047f1c5a78ae5cbc62a32ed2ab78ace2410
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install MongoDB Database Tools (mongodump, mongorestore)
        run: |
          package="mongodb-database-tools-ubuntu2404-x86_64-${DATABASE_TOOLS_VERSION}.deb"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$package" \
            "https://fastdl.mongodb.org/tools/db/$package"
          echo "${DATABASE_TOOLS_SHA256}  $RUNNER_TEMP/$package" | sha256sum --check --strict
          sudo apt-get install --yes --no-install-recommends "$RUNNER_TEMP/$package"
          mongodump --version

      - run: npm ci
      - run: npm run test:integration
      - name: Run the Bruno collection against a fresh API instance
        env:
          MONGODB_SMOKE_URI: mongodb://127.0.0.1:27017/book-tracker-smoke
        run: npm run api:smoke
